[package]
name = "scidesk"
default-run = "scidesk"
version = "0.3.2"
description = "Local-first scientific workspace"
authors = ["SciDesk"]
edition = "2021"

# Localhost development bridges are not installed with the desktop application.
[features]
dev-bridges = []

[[bin]]
name = "project_bridge"
path = "src/bin/project_bridge.rs"
required-features = ["dev-bridges"]

[[bin]]
name = "ideas_dev"
path = "src/bin/ideas_dev.rs"
required-features = ["dev-bridges"]

[[bin]]
name = "journal_dev"
path = "src/bin/journal_dev.rs"
required-features = ["dev-bridges"]

[lib]
name = "scidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
axum = "0.8"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.14"
url = "2"
semver = "1"

# Journal providers reused from v1; already present transitively in Cargo.lock.
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_Common", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
