<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SciDesk · 手机想法</title><link rel="stylesheet" href="/mobile.css"></head><body>
<main id="pairing" hidden><h1>连接 SciDesk</h1><p>请确认电脑与手机处于同一受信任局域网，并在电脑上批准本次连接。</p><label>设备名称<input id="device-name" maxlength="80" value="我的手机" autocomplete="off"></label><button id="request-pair">请求电脑确认</button><p id="pair-state" role="status"></p><p class="hint">局域网 HTTP 连接不提供传输加密。仅在可信网络中使用，不要向公网转发端口。</p></main>
<main id="workbench" hidden><header><strong id="space-name">想法大厅</strong><button id="back-hall" hidden>返回大厅</button><button id="new-idea">＋ 新建</button><details><summary>更多</summary><button id="new-room">新建包间</button><button id="retry">重新同步</button><button id="show-trash">查看回收站</button><button id="export-drafts">导出本机草稿</button><button id="disconnect">退出此手机连接</button></details></header><p id="sync-state" role="status"></p><div class="search"><input id="search" type="search" placeholder="搜索想法、标签或链接" aria-label="搜索想法"><select id="project-filter" aria-label="按项目筛选"><option value="">全部项目</option></select></div><div id="upload-state"></div><section id="rooms-list" aria-label="包间列表"></section><section id="ideas-list" aria-label="想法列表"></section></main>
<dialog id="editor"><header><strong>编辑想法</strong><button id="close-editor">完成</button></header><p id="editor-state" role="status"></p><div class="editor-fields"><label>类型<select id="idea-type"><option value="text">文字</option><option value="image">图片</option><option value="link">链接</option><option value="file">附件</option></select></label><label>标题（可选）<input id="idea-title" maxlength="500"></label><label>正文 / 备注<textarea id="idea-content" rows="9" maxlength="200000"></textarea></label><label>链接（可选）<input id="idea-url" type="url" placeholder="https://"></label><label>标签（可选，逗号分隔）<input id="idea-tags"></label><label>所属位置<select id="idea-room"><option value="">大厅 · 未分类</option></select></label><button id="idea-relations">查看 / 管理关联</button><label>关联项目（可选）<select id="idea-project"><option value="">不关联项目</option></select></label><label class="file-pick">添加图片或附件<input id="idea-files" type="file" multiple></label><label class="file-pick">拍照添加图片<input id="idea-camera" type="file" accept="image/*" capture="environment"></label><div id="editor-attachments"></div><footer><button id="duplicate-idea">复制想法</button><button id="delete-idea" class="danger">移入回收站</button><button id="restore-idea" hidden>恢复想法</button></footer></div></dialog>
<dialog id="conflict"><h2>检测到同步冲突</h2><p>双方内容均已保留，请选择如何处理。</p><h3>电脑上的当前版本</h3><pre id="server-version"></pre><h3>本机待同步版本</h3><pre id="local-version"></pre><label>手动合并正文<textarea id="merge-content" rows="7"></textarea></label><footer><button id="keep-server">保留电脑版本</button><button id="keep-local">保留本机版本</button><button id="merge-version">保存合并正文</button><button id="later-conflict">稍后处理</button></footer></dialog>
<dialog id="room-editor"><header><strong>包间信息</strong><button id="close-room">取消</button></header><label>包间名称<input id="room-name" maxlength="120"></label><label>图标<select id="room-icon"><option value="folder">文件夹</option><option value="lightbulb">灯泡</option><option value="book">书本</option><option value="flask">实验</option><option value="star">星标</option></select></label><label>颜色<input type="color" id="room-color" value="#2563eb"></label><label>导航顺序<input type="number" id="room-order" min="0" max="1000000"></label><button id="save-room">保存包间</button><p id="room-error" role="alert"></p></dialog>
<dialog id="relations"><header><strong id="relations-title">想法关联</strong><button id="close-relations">完成</button></header><label>目标包间<select id="relation-room"></select></label><label>目标想法<select id="relation-target"></select></label><label>关系类型<select id="relation-type"></select></label><label>关系说明<input id="relation-label" maxlength="1000"></label><button id="create-relation">建立关联</button><div id="relation-list"></div><p id="relation-error" role="alert"></p></dialog>
<p id="fatal" role="alert"></p><script type="module" src="/mobile.js"></script></body></html>
